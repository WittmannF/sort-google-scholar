name: Test SortGS
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  schedule:
    - cron: '0 0 1 * *' # Run at 00:00 on the first of every month

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package + test dependencies
      run: pip install -e . pytest
    - name: Run pytest
      run: pytest
    - name: Test CLI Command
      run: sortgs 'machine learning' --debug --nresults 10

  offline:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.10', '3.11']
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
    - name: Install and run deterministic tests
      env:
        MPLBACKEND: Agg
      run: |
        uv venv --python ${{ matrix.python-version }} .venv
        source .venv/bin/activate
        uv pip install -e . pytest
        pytest -q tests/test_offline.py tests/test_searchapi.py
