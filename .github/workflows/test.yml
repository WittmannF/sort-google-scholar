name: Test SortGS
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install and run offline tests
        env:
          MPLBACKEND: Agg
        run: |
          uv sync --group dev --frozen
          uv run pytest
