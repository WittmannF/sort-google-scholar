# Smoke-test the published CLI against live Google Scholar.
# Not part of the default test job (that stays offline).
name: Live sortgs

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/live-sortgs.yml"

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install sortgs from PyPI
        run: pip install sortgs
      - name: Run live Scholar search
        run: sortgs "machine learning" --nresults 20
