name: Publish Python Package to PyPI

# `main` is the release line (day-to-day work lands on `dev`).
# A push or merge to `main` publishes whatever version is in pyproject.toml.
# Re-running the same version is a no-op (`--skip-existing`).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine upload --skip-existing dist/*
